minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--select=E9,F63,F7,F82]

  - repo: local
    hooks:
      - id: codeswarm-quality
        name: CodeSwarm staged quality policy
        entry: python3 scripts/codeswarm-quality.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: react-static-quality
        name: React TypeScript, translations, styles, and UI guardrails
        entry: bash -c 'cd frontend && { test -x node_modules/.bin/tsc || ./scripts/install-deps.sh; } && npm run type-check && npm run ui:guardrails'
        language: system
        files: ^frontend/.*\.(css|html|js|jsx|json|ts|tsx)$
        pass_filenames: false
