name: CodeSwarm quality gate

on:
  pull_request:
  push:
    branches: [main, projectmaker]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned pre-commit runner
        run: python -m pip install pre-commit==4.6.2
      - name: Run repository quality gate
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run changed-file CodeSwarm policy
        env:
          PR_BASE_REF: {% raw %}${{ github.base_ref }}{% endraw %}
          PUSH_BEFORE: {% raw %}${{ github.event.before }}{% endraw %}
        run: |
          if [ -n "$PR_BASE_REF" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1
            BASE_REF="origin/$PR_BASE_REF"
          else
            BASE_REF="$PUSH_BEFORE"
          fi
          if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            python3 scripts/codeswarm-quality.py --changed-from "$BASE_REF"
          else
            python3 scripts/codeswarm-quality.py --all
          fi
